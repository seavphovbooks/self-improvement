  <h3 class="chaph1" id="chap2">The Seven Habits—An Overview</h3>

  <p class="quote3" id="pg46">We are what we repeatedly do. Excellence, then, is not an act, but a habit.</p>

  <p class="quote1">Aristotle</p>

  <p class="noindent4"><span class="drop-cap">O</span><span class="smallcap">UR CHARACTER, BASICALLY</span>, is a composite of our habits. “Sow a thought, reap an action; sow an action, reap a habit; sow a habit, reap a character; sow a character, reap a destiny,” the maxim goes.</p>

  <p>Habits are powerful factors in our lives. Because they are consistent, often unconscious patterns, they constantly, daily, express our character and produce our effectiveness... or ineffectiveness.</p>

  <p>As Horace Mann, the great educator, once said, “Habits are like a cable. We weave a strand of it everyday and soon it cannot be broken.” I personally do not agree with the last part of his expression. I know they can be broken. Habits can be learned and unlearned. But I also know it isn’t a quick fix. It involves a process and a tremendous commitment.</p>

  <p>Those of us who watched the lunar voyage of Apollo 11 were transfixed as we saw the first men walk on the moon and return to earth. Superlatives such as “fantastic” and “incredible” were inadequate to describe those eventful days. But to get there, those astronauts literally had to break out of the tremendous gravity pull of the earth. More energy was spent in the first few minutes of lift-off, in the first few miles of travel, than was used over the next several days to travel half a million miles.</p>

  <p id="cp2s3">Habits, too, have tremendous gravity pull—more than most people realize or would admit. Breaking deeply imbedded habitual tendencies such as procrastination, impatience, criticalness, or <a class="nodec1" id="pg47">selfishness</a> that violate basic principles of human effectiveness involves more than a little willpower and a few minor changes in our lives. “Lift off” takes a tremendous effort, but once we break out of the gravity pull, our freedom takes on a whole new dimension.</p>

  <p>Like any natural force, gravity pull can work with us or against us. The gravity pull of some of our habits may currently be keeping us from going where we want to go. But it is also gravity pull that keeps our world together, that keeps the planets in their orbits and our universe in order. It is a powerful force, and if we use it effectively, we can use the gravity pull of habit to create the cohesiveness and order necessary to establish effectiveness in our lives.</p>

  <p class="smallcapb3">“HABITS” DEFINED</p>

  <p class="noindent2">For our purposes, we will define a habit as the intersection of <span class="italic">knowledge</span>, <span class="italic">skill</span>, and <span class="italic">desire.</span></p>

  <p>Knowledge is the theoretical paradigm, the <span class="italic">what to do</span> and the <span class="italic">why.</span> Skill is the <span class="italic">how to do.</span> And desire is the motivation, the <span class="italic">want to do.</span> In order to make something a habit in our lives, we have to have all three.</p>

  <p>I may be ineffective in my interactions with my work associates, my spouse, or my children because I constantly tell them what I think, but I never really listen to them. Unless I search out correct principles of human interaction, I may not even <span class="italic">know</span> I need to listen.</p>

  <p>Even if I do know that in order to interact effectively with others I really need to listen to them, I may not have the skill. I may not know <span class="italic">how</span> to really listen deeply to another human being.</p>

  <p>But knowing I need to listen and knowing how to listen is not enough. Unless I <span class="italic">want</span> to listen, unless I have the desire, it won’t be a habit in my life. Creating a habit requires work in all three dimensions.</p>

  <p>The being/seeing change is an upward process—being changing seeing, which in turn changes being, and so forth, as we move in an upward spiral of growth. By working on knowledge, skill, and desire, we can break through to new levels of personal and interpersonal effectiveness as we break with old paradigms that may have been a source of pseudo-security for years.</p>

  <p>It’s sometimes a painful process. It’s a change that has to be <a class="nodec1" id="pg48">motivated</a> by a higher purpose, by the willingness to subordinate what you think you want now for what you want later. But this process produces happiness, “the object and design of our existence.” Happiness can be defined, in part at least, as the fruit of the desire and ability to sacrifice what we want <span class="italic">now</span> for what we want <span class="italic">eventually.</span></p>

  <p class="center3"><span><img alt="" src="../Images/image005.png"/></span></p>

  <p class="center1">EFFECTIVE HABITS</p>

  <p class="center1">Internalized principles and patterns of behavior</p>

  <p class="smallcapb3">THE MATURITY CONTINUUM</p>

  <p class="noindent2">The Seven Habits are not a set of separate or piecemeal psych-up formulas. In harmony with the natural laws of growth, they provide an incremental, sequential, highly integrated approach to <a class="nodec1" id="pg49">the</a> development of personal and interpersonal effectiveness. They move us progressively on a Maturity Continuum from <span class="italic">dependence</span> to <span class="italic">independence</span> to <span class="italic">interdependence.</span></p>

  <p>We each begin life as an infant, totally <span class="italic">dependent</span> on others. We are directed, nurtured, and sustained by others. Without this nurturing, we would only live for a few hours or a few days at the most.</p>

  <p>Then gradually, over the ensuing months and years, we become more and more <span class="italic">independent</span>—physically, mentally, emotionally, and financially—until eventually we can essentially take care of ourselves, becoming inner-directed and self-reliant.</p>

  <p>As we continue to grow and mature, we become increasingly aware that all of nature is <span class="italic">interdependent</span>, that there is an ecological system that governs nature, including society. We further discover that the higher reaches of our nature have to do with our relationships with others—that human life also is interdependent.</p>

  <p>Our growth from infancy to adulthood is in accordance with natural law. And there are many dimensions to growth. Reaching our full physical maturity, for example, does not necessarily assure us of simultaneous emotional or mental maturity. On the other hand, a person’s physical dependence does not mean that he or she is mentally or emotionally immature.</p>

  <p>On the maturity continuum, <span class="italic">dependence</span> is the paradigm of <span class="italic">you—you</span> take care of me; <span class="italic">you</span> come through for me; <span class="italic">you</span> didn’t come through; I blame <span class="italic">you</span> for the results.</p>

  <p><span class="italic">Independence</span> is the paradigm of <span class="italic">I</span>—<span class="italic">I</span> can do it; <span class="italic">I</span> am responsible; <span class="italic">I</span> am self-reliant; <span class="italic">I</span> can choose.</p>

  <p><span class="italic">Interdependence</span> is the paradigm of <span class="italic">we—we</span> can do it; <span class="italic">we</span> can cooperate; <span class="italic">we</span> can combine our talents and abilities and create something greater together.</p>

  <p>Dependent people need others to get what they want. Indepen­dent people can get what they want through their own effort. Interdependent people combine their own efforts with the efforts of others to achieve their greatest success.</p>

  <p>If I were physically dependent—paralyzed or disabled or limited in some physical way—I would need you to help me. If I were emotionally dependent, my sense of worth and security would come from your opinion of me. If you didn’t like me, it could be devastating. If I were intellectually dependent, I would count on you to do my thinking for me, to think through the issues and problems of my life.</p>

  <p id="pg50">If I were independent, physically, I could pretty well make it on my own. Mentally, I could think my own thoughts, I could move from one level of abstraction to another. I could think creatively and analytically and organize and express my thoughts in under­standable ways. Emotionally, I would be validated from within. I would be inner directed. My sense of worth would not be a function of being liked or treated well.</p>

  <p>It’s easy to see that independence is much more mature than dependence. Independence is a major achievement in and of itself. But independence is not supreme.</p>

  <p>Nevertheless, the current social paradigm enthrones indepen­dence. It is the avowed goal of many individuals and social movements. Most of the self-improvement material puts indepen­dence on a pedestal, as though communication, teamwork, and cooperation were lesser values.</p>

  <p>But much of our current emphasis on independence is a reaction to dependence—to having others control us, define us, use us, and manipulate us.</p>

  <p>The little understood concept of interdependence appears to many to smack of dependence, and therefore, we find people, often for selfish reasons, leaving their marriages, abandoning their children, and forsaking all kinds of social responsibility—all in the name of independence.</p>

  <p>The kind of reaction that results in people “throwing off their shackles,” becoming “liberated,” “asserting themselves,” and “doing their own thing” often reveals more fundamental depen­dencies that cannot be run away from because they are internal rather than external—dependencies such as letting the weaknesses of other people ruin our emotional lives or feeling victimized by people and events out of our control.</p>

  <p>Of course, we may need to change our circumstances. But the dependence problem is a personal maturity issue that has little to do with circumstances. Even with better circumstances, immaturity and dependence often persist.</p>

  <p>True independence of character empowers us to act rather than be acted upon. It frees us from our dependence on circumstances and other people and is a worthy, liberating goal. But it is not the ultimate goal in effective living.</p>

  <p>Independent thinking alone is not suited to interdependent reality. Independent people who do not have the maturity to think and act interdependently may be good individual producers, but <a class="nodec1" id="pg51">they</a> won’t be good leaders or team players. They’re not coming from the paradigm of interdependence necessary to succeed in marriage, family, or organizational reality.</p>

  <p>Life is, by nature, highly interdependent. To try to achieve maximum effectiveness through independence is like trying to play tennis with a golf club—the tool is not suited to the reality.</p>

  <p>Interdependence is a far more mature, more advanced concept. If I am physically interdependent, I am self-reliant and capable, but I also realize that you and I working together can accomplish far more than, even at my best, I could accomplish alone. If I am emotionally interdependent, I derive a great sense of worth within myself, but I also recognize the need for love, for giving, and for receiving love from others. If I am intellectually interdependent, I realize that I need the best thinking of other people to join with my own.</p>

  <p>As an interdependent person, I have the opportunity to share myself deeply, meaningfully, with others, and I have access to the vast resources and potential of other human beings.</p>

  <p>Interdependence is a choice only independent people can make. Dependent people cannot choose to become interdependent. They don’t have the character to do it; they don’t own enough of themselves.</p>

  <p>That’s why Habits 1, 2, and 3 in the following chapters deal with self-mastery. They move a person from dependence to indepen­dence. They are the “Private Victories,” the essence of character growth. <span class="italic">Private victories precede public victories.</span> You can’t invert that process anymore than you can harvest a crop before you plant it. It’s inside-out.</p>

  <p>As you become truly independent, you have the foundation for effective interdependence. You have the character base from which you can effectively work on the more personality-oriented “Public Victories” of teamwork, cooperation, and communication in Habits 4, 5, and 6.</p>

  <p>That does not mean you have to be perfect in Habits 1, 2, and 3 before working on Habits 4, 5, and 6. Understanding the sequence will help you manage your growth more effectively, but I’m not suggesting that you put yourself in isolation for several years until you fully develop Habits 1, 2, and 3.</p>

  <p>As part of an interdependent world, you have to relate to that world every day. But the acute problems of that world can easily obscure the chronic character causes. Understanding how what <a class="nodec1" id="pg52">you</a> are impacts every interdependent interaction will help you to focus your efforts sequentially, in harmony with the natural laws of growth.</p>

  <p>Habit 7 is the habit of renewal—a regular, balanced renewal of the four basic dimensions of life. It circles and embodies all the other habits. It is the habit of continuous improvement that creates the upward spiral of growth that lifts you to new levels of understanding and living each of the habits as you come around to them on a progressively higher plane.*</p>

  <p>The diagram in the image <a href="#diag1">below</a> is a visual representation of the sequence and the interdependence of the Seven Habits, and will be used throughout this book as we explore both the sequential relationship between the habits and also their synergy—how, in relating to each other, they create bold new forms of each other that add even more to their value. Each concept or habit will be highlighted as it is introduced.</p>

  <p class="center3" id="diag1"><span><img alt="" src="../Images/image006.jpg"/></span></p>

  <p class="center1" id="pg53">THE SEVEN HABITS PARADIGM</p>

  <p class="smallcapb3">EFFECTIVENESS DEFINED</p>

  <p class="noindent2">The Seven Habits are habits of <span class="italic">effectiveness.</span> Because they are based on principles, they bring the maximum long-term beneficial results possible. They become the basis of a person’s character, creating an empowering center of correct maps from which an individual can effectively solve problems, maximize opportunities, and continually learn and integrate other principles in an upward spiral of growth.</p>

  <p>They are also habits of effectiveness because they are based on a paradigm of effectiveness that is in harmony with a natural law, a principle I call the “P/PC Balance,” which many people break themselves against. This principle can be easily understood by remembering Aesop’s fable of the goose and the golden egg.</p>

  <p>This fable is the story of a poor farmer who one day discovers in the nest of his pet goose a glittering golden egg. At first, he thinks it must be some kind of trick. But as he starts to throw the egg aside, he has second thoughts and takes it in to be appraised instead.</p>

  <p>The egg is pure gold! The farmer can’t believe his good fortune. He becomes even more incredulous the following day when the experience is repeated. Day after day, he awakens to rush to the <a class="nodec1" id="pg54">nest</a> and find another golden egg. He becomes fabulously wealthy; it all seems too good to be true.</p>

  <p>But with his increasing wealth comes greed and impatience. Unable to wait day after day for the golden eggs, the farmer decides he will kill the goose and get them all at once. But when he opens the goose, he finds it empty. There are no golden eggs—and now there is no way to get any more. The farmer has destroyed the goose that produced them.</p>

  <p>I suggest that within this fable is a natural law, a principle—the basic definition of effectiveness. Most people see effectiveness from the golden egg paradigm: the more you produce, the more you do, the more effective you are.</p>

  <p>But as the story shows, true effectiveness is a function of two things: what is produced (the golden eggs) and the producing asset or capacity to produce (the goose).</p>

  <p>If you adopt a pattern of life that focuses on golden eggs and neglects the goose, you will soon be without the asset that produces golden eggs. On the other hand, if you only take care of the goose with no aim toward the golden eggs, you soon won’t have the wherewithal to feed yourself or the goose.</p>

  <p>Effectiveness lies in the balance—what I call the P/PC Balance. <span class="italic">P</span> stands for <span class="italic">production</span> of desired results, the golden eggs. <span class="italic">PC</span> stands for <span class="italic">production capability</span>, the ability or asset that produces the golden eggs.</p>

  <p class="smallcapb3">THREE KINDS OF ASSETS</p>

  <p class="noindent2">Basically, there are three kinds of assets: physical, financial, and human. Let’s look at each one in turn.</p>

  <p>A few years ago, I purchased a <span class="italic">physical asset</span>—a power lawnmower. I used it over and over again without doing anything to maintain it. The mower worked well for two seasons, but then it began to break down. When I tried to revive it with service and sharpening, I discovered the engine had lost over half its original power capacity. It was essentially worthless.</p>

  <p>Had I invested in PC—in preserving and maintaining the asset—I would still be enjoying its P—the mowed lawn. As it was, I had to spend far more time and money replacing the mower than I ever would have spent, had I maintained it. It simply wasn’t effective.</p>

  <p>In our quest for short-term returns, or results, we often ruin a prized physical asset—a car, a computer, a washer or dryer, even <a class="nodec1" id="pg55">our</a> body or our environment. Keeping P and PC in balance makes a tremendous difference in the effective use of physical assets.</p>

  <p>It also powerfully impacts the effective use of <span class="italic">financial</span> assets. How often do people confuse principal with interest? Have you ever invaded principal to increase your standard of living, to get more golden eggs? The decreasing principal has decreasing power to produce interest or income. And the dwindling capital becomes smaller and smaller until it no longer supplies even basic needs.</p>

  <p>Our most important financial asset is our own capacity to earn. If we don’t continually invest in improving our own PC, we severely limit our options. We’re locked into our present situation, running scared of our corporation or our boss’s opinion of us, economically dependent and defensive. Again, it simply isn’t effective.</p>

  <p>In the <span class="italic">human</span> area, the P/PC Balance is equally fundamental, but even more important, because people control physical and financial assets.</p>

  <p>When two people in a marriage are more concerned about getting the golden eggs, the benefits, than they are in preserving the relationship that makes them possible, they often become insensitive and inconsiderate, neglecting the little kindnesses and courtesies so important to a deep relationship. They begin to use control levers to manipulate each other, to focus on their own needs, to justify their own position and look for evidence to show the wrongness of the other person. The love, the richness, the softness and spontaneity begin to deteriorate. The goose gets sicker day by day.</p>

  <p>And what about a parent’s relationship with a child? When children are little, they are very dependent, very vulnerable. It becomes so easy to neglect the PC work—the training, the communicating, the relating, the listening. It’s easy to take advantage, to manipulate, to get what you want the way you want it—right now! You’re bigger, you’re smarter, and you’re <span class="italic">right!</span> So why not just tell them what to do? If necessary, yell at them, intimidate them, insist on your way.</p>

  <p>Or you can indulge them. You can go for the golden egg of popularity, of pleasing them, giving them their way all the time. Then they grow up without any internal sense of standards or expectations, without a personal commitment to being disciplined or responsible.</p>

  <p>Either way—authoritarian or permissive—you have the golden <a class="nodec1" id="pg56">egg</a> mentality. You want to have your way or you want to be liked. But what happens, meantime, to the goose? What sense of responsibility, of self-discipline, of confidence in the ability to make good choices or achieve important goals is a child going to have a few years down the road? And what about your relationship? When he reaches those critical teenage years, the identity crises, will he know from his experience with you that you will listen without judging, that you really, deeply care about him as a person, that you can be trusted, no matter what? Will the relation­ship be strong enough for you to reach him, to communicate with him, to influence him?</p>

  <p>Suppose you want your daughter to have a clean room—that’s P, production, the golden egg. And suppose you want her to clean it—that’s PC, production capability. Your daughter is the goose, the asset, that produces the golden egg.</p>

  <p>If you have P and PC in balance, she cleans the room cheerfully, without being reminded, because she is committed and has the discipline to stay with the commitment. She is a valuable asset, a goose that can produce golden eggs.</p>

  <p>But if your paradigm is focused on production, on getting the room clean, you might find yourself nagging her to do it. You might even escalate your efforts to threatening or yelling, and in your desire to get the golden egg, you undermine the health and welfare of the goose.</p>

  <p class="noindent3">Let me share with you an interesting PC experience I had with one of my daughters. We were planning a private date, which is something I enjoy regularly with each of my children. We find that the anticipation of the date is as satisfying as the realization.</p>

  <p>So I approached my daughter and said, “Honey, tonight’s your night. What do you want to do?”</p>

  <p>“Oh, Dad, that’s okay,” she replied.</p>

  <p>“No, really,” I said. “What would you like to do?”</p>

  <p>“Well,” she finally said, “what I want to do, you don’t really want to do.”</p>

  <p>“Really, honey,” I said earnestly, “I want to do it. No matter what, it’s your choice.”</p>

  <p>“I want to go see <span class="italic">Star Wars</span>,” she replied. “But I know you don’t like <span class="italic">Star Wars.</span> You slept through it before. You don’t like these fantasy movies. That’s okay, Dad.”</p>

  <p>“No, honey, if that’s what you’d like to do, I’d like to do it.”</p>

  <p id="pg57">“Dad, don’t worry about it. We don’t always have to have this date.” She paused and then added, “But you know why you don’t like <span class="italic">Star Wars</span>? It’s because you don’t understand the philosophy and training of a Jedi Knight.”</p>

  <p>“What?”</p>

  <p>“You know the things you teach, Dad? Those are the same things that go into the training of a Jedi Knight.”</p>

  <p>“Really? Let’s go to <span class="italic">Star Wars</span>!”</p>

  <p>And we did. She sat next to me and gave me the paradigm. I became her student, her learner. It was totally fascinating. I could begin to see out of a new paradigm the whole way a Jedi Knight’s basic philosophy in training is manifested in different circum­stances.</p>

  <p>That experience was not a planned P experience; it was the serendipitous fruit of a PC investment. It was bonding and very satisfying. But we enjoyed golden eggs, too, as the goose—the quality of the relationship—was significantly fed.</p>

  <p class="smallcapb3">ORGANIZATIONAL PC</p>

  <p class="noindent2">One of the immensely valuable aspects of any correct principle is that it is valid and applicable in a wide variety of circumstances. Throughout this book, I would like to share with you some of the ways in which these principles apply to organizations, including families, as well as to individuals.</p>

  <p>When people fail to respect the P/PC Balance in their use of physical assets in organizations, they decrease organizational effectiveness and often leave others with dying geese.</p>

  <p>For example, a person in charge of a physical asset, such as a machine, may be eager to make a good impression on his superiors. Perhaps the company is in a rapid growth stage and promotions are coming fast. So he produces at optimum levels—no downtime, no maintenance. He runs the machine day and night. The production is phenomenal, costs are down, and profits skyrocket. Within a short time, he’s promoted. Golden eggs!</p>

  <p>But suppose you are his successor on the job. You inherit a very sick goose, a machine that, by this time, is rusted and starts to break down. You have to invest heavily in downtime and maintenance. Costs skyrocket; profits nose-dive. And who gets blamed for the loss of golden eggs? You do. Your predecessor liquidated the asset, but the accounting system only reported unit production, costs, and profit.</p>

  <p id="pg58">The P/PC Balance is particularly important as it applies to the human assets of an organization—the customers and the employees.</p>

  <p>I know of a restaurant that served a fantastic clam chowder and was packed with customers every day at lunchtime. Then the business was sold, and the new owner focused on golden eggs—he decided to water down the chowder. For about a month, with costs down and revenues constant, profits zoomed. But little by little, the customers began to disappear. Trust was gone, and business dwindled to almost nothing. The new owner tried desperately to reclaim it, but he had neglected the customers, violated their trust, and lost the asset of customer loyalty. There was no more goose to produce the golden egg.</p>

  <p>There are organizations that talk a lot about the customer and then completely neglect the people that deal with the customer—the employees. The PC principle is to <span class="italic">always treat your employees exactly as you want them to treat your best customers.</span></p>

  <p>You can buy a person’s hand, but you can’t buy his heart. His heart is where his enthusiasm, his loyalty is. You can buy his back, but you can’t buy his brain. That’s where his creativity is, his ingenuity, his resourcefulness.</p>

  <p>PC work is treating employees as volunteers just as you treat customers as volunteers, because that’s what they are. They volunteer the best part—their hearts and minds.</p>

  <p class="noindent2">I was in a group once where someone asked, “How do you shape up lazy and incompetent employees?” One man responded, “Drop hand grenades!” Several others cheered that kind of macho management talk, that “shape up or ship out” supervision approach.</p>

  <p>But another person in the group asked, “Who picks up the pieces?”</p>

  <p>“No pieces.”</p>

  <p>“Well, why don’t you do that to your customers?” the other man replied. “Just say, ‘Listen, if you’re not interested in buying, you can just ship out of this place.’”</p>

  <p>He said, “You can’t do that to customers.”</p>

  <p>“Well, how come you can do it to employees?”</p>

  <p>“Because they’re in your employ.”</p>

  <p>“I see. Are your employees devoted to you? Do they work hard? How’s the turnover?”</p>

  <p>“Are you kidding? You can’t find good people these days. <a class="nodec1" id="pg59">There’s</a> too much turnover, absenteeism, moonlighting. People just don’t care anymore.”</p>

  <p class="noindent2">That focus on golden eggs—that attitude, that paradigm—is totally inadequate to tap into the powerful energies of the mind and heart of another person. A short-term bottom line is important, but it isn’t all-important.</p>

  <p>Effectiveness lies in the balance. Excessive focus on P results in ruined health, worn-out machines, depleted bank accounts, and broken relationships. Too much focus on PC is like a person who runs three or four hours a day, bragging about the extra ten years of life it creates, unaware he’s spending them running. Or a person endlessly going to school, never producing, living on other peo­ple’s golden eggs—the eternal student syndrome.</p>

  <p>To maintain the P/PC Balance, the balance between the golden egg (production) and the health and welfare of the goose (production capability) is often a difficult judgment call. But I suggest it is the very essence of effectiveness. It balances short term with long term. It balances going for the grade and paying the price to get an education. It balances the desire to have a room clean and the building of a relationship in which the child is internally committed to do it—cheerfully, willingly, without external supervision.</p>

  <p>It’s a principle you can see validated in your own life when you burn the candle at both ends to get more golden eggs and wind up sick or exhausted, unable to produce any at all; or when you get a good night’s sleep and wake up ready to produce throughout the day.</p>

  <p>You can see it when you press to get your own way with someone and somehow feel an emptiness in the relationship; or when you really take time to invest in a relationship and you find the desire and ability to work together, to communicate, takes a quantum leap.</p>

  <p>The P/PC Balance is the very essence of effectiveness. It’s validated in every arena of life. We can work with it or against it, but it’s there. It’s a lighthouse. It’s the definition and paradigm of effectiveness upon which the Seven Habits in this book are based.</p>

  <p class="smallcapb3">HOW TO USE THIS BOOK</p>

  <p class="noindent2">Before we begin work on the Seven Habits of Highly Effective People, I would like to suggest two paradigm shifts that will greatly increase the value you will receive from this material.</p>

  <p id="pg60">First, I would recommend that you not “see” this material as a book, in the sense that it is something to read once and put on a shelf.</p>

  <p id="cp2s19">You may choose to read it completely through once for a sense of the whole. But the material is designed to be a companion in the continual process of change and growth. It is organized incrementally and with suggestions for application at the end of each habit so that you can study and focus on any particular habit as you are ready.</p>

  <p>As you progress to deeper levels of understanding and implementation, you can go back time and again to the principles contained in each habit and work to expand your knowledge, skill, and desire.</p>

  <p>Second, I would suggest that you shift your paradigm of your own involvement in this material from the role of learner to that of teacher. Take an inside-out approach, and read with the purpose in mind of sharing or discussing what you learn with someone else within 48 hours after you learn it.</p>

  <p>If you had known, for example, that you would be teaching the material on the P/PC Balance principle to someone else within 48 hours, would it have made a difference in your reading experience? Try it now as you read the final section in this chapter. Read as though you are going to teach it to your spouse, your child, a business associate, or a friend today or tomorrow, while it is still fresh, and notice the difference in your mental and emotional process.</p>

  <p>I guarantee that if you approach the material in each of the following chapters in this way, you will not only better remember what you read, but your perspective will be expanded, your understanding deepened, and your motivation to apply the mate­rial increased.</p>

  <p>In addition, as you openly, honestly share what you’re learning with others, you may be surprised to find that negative labels or perceptions others may have of you tend to disappear. Those you teach will see you as a changing, growing person, and will be more inclined to be helpful and supportive as you work, perhaps together, to integrate the Seven Habits into your lives.</p>

  <p class="smallcapb3" id="cp2s20">WHAT YOU CAN EXPECT</p>

  <p class="noindent2">In the last analysis, as Marilyn Ferguson observed, “No one can persuade another to change. Each of us guards a gate of change <a class="nodec1" id="pg61">that</a> can only be opened from the inside. We cannot open the gate of another, either by argument or by emotional appeal.”</p>

  <p>If you decide to open your “gate of change” to really understand and live the principles embodied in the Seven Habits, I feel comfortable in assuring you several positive things will happen.</p>

  <p>First, your growth will be <span class="italic">evolutionary</span>, but the net effect will be <span class="italic">revolutionary.</span> Would you not agree that the P/PC Balance principle alone, if fully lived, would transform most individuals and organizations?</p>

  <p>The net effect of opening the “gate of change” to the first three habits—the habits of Private Victory—will be significantly increased self-confidence. You will come to know yourself in a deeper, more meaningful way—your nature, your deepest values and your unique contribution capacity. As you live your values, your sense of identity, integrity, control, and inner-directedness will infuse you with both exhilaration and peace. You will define yourself from within, rather than by people’s opinions or by comparisons to others. “Wrong” and “right” will have little to do with being found out.</p>

  <p>Ironically, you’ll find that as you care less about what others think of you, you will care more about what others think of themselves and their worlds, including their relationship with you. You’ll no longer build your emotional life on other people’s weaknesses. In addition, you’ll find it easier and more desirable to change because there is something—some core deep within—that is essentially changeless.</p>

  <p>As you open yourself to the next three habits—the habits of Public Victory—you will discover and unleash both the desire and the resources to heal and rebuild important relationships that have deteriorated, or even broken. Good relationships will improve—become deeper, more solid, more creative, and more adventuresome.</p>

  <p>The seventh habit, if deeply internalized, will renew the first six and will make you truly independent and capable of effective interdependence. Through it, you can charge your own batteries.</p>

  <p>Whatever your present situation, I assure you that you are not your habits. You can replace old patterns of self-defeating behavior with new patterns, new habits of effectiveness, happiness, and trust-based relationships.</p>

  <p>With genuine caring, I encourage you to open the gate of change and growth as you study these habits. Be patient with yourself. <a class="nodec1" id="pg62">Self-growth</a> is tender; it’s holy ground. There’s no greater investment.</p>

  <p>It’s obviously not a quick fix. But I assure you, you will feel benefits and see immediate payoffs that will be encouraging. In the words of Thomas Paine, “That which we obtain too easily, we esteem too lightly. It is dearness only which gives everything its value. Heaven knows how to put a proper price on its goods.”</p>
