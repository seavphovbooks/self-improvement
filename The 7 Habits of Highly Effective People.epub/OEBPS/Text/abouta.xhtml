  <h3 class="chaph" id="about">About the Author</h3>

  <p class="noindent4"><span class="bold">Stephen R. Covey</span> is an internationally respected leadership authority, family expert, teacher, organizational consultant and author who has dedicated his life to teaching principle-centered living and leadership to build both families and organizations. He holds an M.B.A. from Harvard University and a doctorate from Brigham Young University, where he was a professor of organizational behavior and business management and also served as director of university relations and assistant to the president.</p>

  <p>Dr. Covey is the author of several acclaimed books, including the in­ternational bestseller, <span class="italic">The 7 Habits of Highly Effective People</span>, which was named the #1 Most Influential Business Book of the Twentieth Century and one of the top-ten most influential management books ever. It has sold more than 15 million copies in thirty-eight languages throughout the world. Other bestsellers include <span class="italic">First Things First</span>, <span class="italic">Principle-Centered Leadership</span> and <span class="italic">The 7 Habits of Highly Effective Families</span>, bringing the com­bined total to more than 20 million books sold.</p>

  <p>As a father of nine and grandfather of forty-three, he received the 2003 Fatherhood Award from the National Fatherhood Initiative, which he says is the most meaningful award he has ever received. Other awards given to Dr. Covey include the Thomas More College Medallion for con­tinuing service to humanity, Speaker of the Year in 1999, the Sikh’s 1998 International Man of Peace Award, the 1994 International Entrepreneur of the Year Award and the National Entrepreneur of the Year Lifetime Achievement Award for Entrepreneurial Leadership. Dr. Covey has also been recognized as one of <span class="italic">Time</span> magazine’s 25 Most Influential Ameri­cans and has received seven honorary doctorate degrees.</p>

  <p>Dr. Covey is the cofounder and vice chairman of FranklinCovey Com­pany, the leading global professional services firm with offices in 123 countries. They share Dr. Covey’s vision, discipline and passion to in­spire, lift and provide tools for change and growth of individuals and organizations throughout the world.</p>
