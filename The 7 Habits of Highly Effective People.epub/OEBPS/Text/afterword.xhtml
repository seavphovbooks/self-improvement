  <h3 class="chaph" id="after">Afterword:<br/>
  Questions I am Often Asked</h3>

  <p class="noindent3" id="pg321">Frankly, I’ve always been embarrassed by personal questions like some in this afterword. But I am asked them so often and with such interest that I’ve gone ahead and included them here. Many of these questions and answers were also included in <span class="italic">Living the 7 Habits.</span></p>

  <p class="noindent2"><span class="smallcapb">The <span class="italic">7 Habits</span> was published in 1989. Given your experiences in the many years that have followed, what would you change, add, or subtract?</span></p>

  <p class="noindent2">I’m not responding lightly, but frankly I wouldn’t change any­thing. I might go deeper and apply wider but I have had the opportunity to do that in some of the books released since then.</p>

  <p>For example, over 250,000 individuals were profiled showing Habit 3, Put First Things First, as the habit most neglected. So, the <span class="italic">First Things First</span> book (published 1996) went deeper into Habits 2 and 3 but also added more substance and illustrations for all the other habits.</p>

  <p><span class="italic">The 7 Habits of Highly Effective Families</span> applied the 7 Habits framework of thinking into building strong, happy, highly effec­tive families.</p>

  <p>Also, my son, Sean, applied the framework to the unique needs, interests and challenges of teens in a very visually attractive, entertaining, and edifying way in <span class="italic">The 7 Habits of Highly Effective Teens.</span></p>

  <p>We have also had tens of thousands of people tell us of the significant impact of becoming the creative force of their own lives through internalizing the 7 Habits. Seventy six of them shared the details of their fascinating stories of courage and inspiration <a class="nodec1" id="pg322">in</a> <span class="italic">Living the 7 Habits</span>—showing the transforming power of the principles in all kinds of personal, family, and organizational settings regardless of their circumstances, organizational position, or prior life experiences.</p>

  <p class="noindent3"><span class="smallcapb">What have you learned about the 7 Habits since the book’s release?</span></p>

  <p class="noindent2">I have learned or had reinforced many things. I’ll briefly mention ten learnings.</p>

  <p class="noindent2">1. The importance of understanding the difference between principles and values. Principles are natural laws that are external to us and that ultimately control the consequences of our actions. Values are internal and subjective and represent that which we feel strongest about in guiding our behavior. Hopefully we will come to <span class="italic">value principles</span>, so that we get the results we want now in a way that enables us to get even greater results in the future, which is how I define effectiveness. Everyone has values; even criminal gangs have values. Values govern people’s behavior but principles govern the consequences of those behaviors. Principles are independent of us. They operate regardless of our awareness of them, acceptance of them, liking of them, belief in them, or obeying of them. I have come to believe that humility is the mother of all virtues. Humility says we are not in control, principles are in control, therefore we submit ourselves to principles. Pride says that we are in control, and since our values govern our behavior, we can simply do life our way. We may do so but the consequences of our behavior flow from principles not our values. Therefore we should <span class="italic">value principles.</span></p>

  <p class="noindent2">2. From experiences all over the world with this material I have come to see the <span class="italic">universal</span> nature of the principles undergirding this material. Illustrations and practices may vary and are cultur­ally specific, but the principles are the same. I have found the principles contained in the 7 Habits in all six major world <a class="nodec1" id="pg323">reli­gions</a> and have actually drawn upon quotations from sacred writings of those religions when teaching in those cultures. I have done this in the Middle East, India, Asia, Australia and the South Pacific, South America, Europe, North America, Africa, and among Native Americans and other indigenous peoples. All of us, men and women alike, face similar problems, have similar needs, and internally resonate with the underlying principles. There is an internal sense of the principle of justice or win/win. There is an internal moral sense of the principle of responsibility, of the principle of purpose, of integrity, of respect, of cooperation, of communication, of renewal. These are universal. But practices are not. They are situationally specific. Every culture interprets universal principles in unique ways.</p>

  <p class="noindent2">3. I have come to see the organizational implications of the 7 Habits, although, in the strict technical sense, an organization does not have habits. Its culture has norms or mores or social codes, which repre­sent habits. An organization also has established systems, processes, and procedures. These represent habits. In fact, in the last analysis, all behavior is personal. It is individual even though it often is part of collective behavior in the form of decisions made by management regarding structure and systems, processes and practices. We have worked with thousands of organizations in most every industry and profession and have found that the same basic principles contained in the 7 Habits apply and define effectiveness.</p>

  <p class="noindent2">4. You can teach all 7 Habits by starting with any one habit. And you can also teach one habit in a way that leads to the teaching of the other six. It’s like a hologram where the whole is contained in the part and the part is contained in the whole.</p>

  <p class="noindent2">5. Even though the 7 Habits represents an inside-out approach, it works most successfully when you start with the outside challenge and then take the inside-out approach. In other words, if you are <a class="nodec1" id="pg324">having</a> a relationship challenge, say a breakdown of communication and trust, this will define the nature of the needed inside-out ap­proach in winning the kind of private victory that enables the pub­lic victory meeting that challenge. This is the reason I often teach Habits 4, 5, and 6 before I teach Habits 1, 2, and 3.</p>

  <p class="noindent2">6. Interdependence is ten times more difficult than independence. It demands so much more mental and emotional independence to think win/win when another person is into win/lose, to seek to understand first when everything inside you cries out for under­standing, and to search for a better third alternative when compromise is so much easier. In other words, to work successfully with others in creative cooperative ways requires an enormous amount of independence, internal security, and self-mastery. Oth­erwise, what we call interdependency is really counter-dependency where people do the opposite to assert their independence, or codependency where they literally need the other person’s weakness to fulfill their need and to justify their own weakness.</p>

  <p class="noindent2">7. You can pretty well summarize the first three habits with the expression “make and keep a promise.” And you can pretty well summarize the next three habits with the expression “involve oth­ers in the problem and work out the solution together.”</p>

  <p class="noindent2">8. The 7 Habits represents a new language even though there are fewer than a dozen unique words or phrases. This new language be­comes a code, a shorthand way of saying a great deal. When you say to another “was that a deposit or a withdrawal?” “Is that reactive or proactive?” “Is that synergistic or a compromise?” “Is that win/win or win/lose or lose/win?” “Is that putting first things first or second things first?” “Is that beginning with the means in mind or the end in mind?” I’ve seen entire cultures transformed by a wide under­standing of and commitment to the principles and concepts sym­bolized by these very special code words.</p>

  <p class="noindent2" id="pg325">9. Integrity is a higher value than loyalty. Or better put, integrity is the highest form of loyalty. Integrity means being integrated or centered on principles not on people, organizations, or even fam­ily. You will find that the root of most issues that people are deal­ing with is “is it popular (acceptable, political), or is it right?” When we prioritize being loyal to a person or group over doing what we feel to be right, we lose integrity. We may temporarily gain popularity or build loyalty, but, downstream, this loss of integrity will undermine even those relationships. It’s like badmouthing someone behind their back. The person you are temporarily united with through badmouthing someone else knows you would bad mouth them under different pressures and cir­cumstances. In a sense, the first three habits represent integrity and the next three loyalty; but they are totally interwoven. Over time, integrity produces loyalty. If you attempt to reverse them and go for loyalty first, you will find yourself temporizing and compromising integrity. It’s better to be trusted than to be liked. Ultimately, trust and respect will generally produce love.</p>

  <p class="noindent2">10. Living the 7 Habits is a constant struggle for everyone. Every­one falters from time to time on each of the seven and sometimes all seven simultaneously. They really are simple to understand but difficult to consistently practice. They are common sense but what is common sense is not always common practice.</p>

  <p class="noindent3"><span class="smallcapb">Which habit do you personally have the greatest difficulty with?</span></p>

  <p class="noindent2">Habit 5. When I am really tired and already convinced I’m right, I really don’t want to listen. I may even pretend to listen. Basically I am guilty of the same thing I talk about, listening with the intent to reply, not to understand. In fact, in some sense, I strug­gle almost daily with all 7 Habits. I have conquered none of them. I see them more as life principles that we never really <a class="nodec1" id="pg326">mas­ter</a> and that the closer we come to their mastery, the more aware we become of how far we really have yet to go. It’s like the more you know the more you know you don’t know.</p>

  <p>This is why I often gave my university students 50 percent of the grade for the quality of their questions and the other 50 per­cent for the quality of their answer to their questions. Their true level of knowledge is better revealed that way.</p>

  <p>Similarly, the 7 Habits represents an upward cycle.</p>

  <p>Habit 1 at a high level is vastly different from Habit 1 at a lower level. To be proactive at the beginning level may only be awareness of the space between stimulus and response. At the next level it may involve a choice such as, not to get back at or to get even. At the next level, to give feedback. At the next level, to ask forgiveness. At the next level, to forgive. At the next, to for­give parents. At the next level, to forgive dead parents. And the next level, to simply not take offense.</p>

  <p class="center3"><span><img alt="" height="99" src="../Images/image040.jpg" width="136"/></span></p>

  <p class="noindent3"><span class="smallcapb">You’re the vice-chairman of FranklinCovey Company. Does FranklinCovey live the 7 Habits?</span></p>

  <p class="noindent2">We try to. Continually trying to live what we teach is one of our most fundamental values. But we don’t do it perfectly. Like any other business, we’re challenged by changing market realities and by integrating the two cultures of the former Covey Leader­ship Center and Franklin Quest. The merger took place in the summer of 1997. It takes time, patience, and persistence in apply­ing the principles and the true test of our success will be in the long run. No snapshot will give an accurate picture.</p>

  <p id="pg327">Any airplane is off track much of the time but just keeps com­ing back to the flight plan. Eventually, it arrives at its destination. This is true with all of us as individuals, families, or organiza­tions. The key is to have an “End in Mind” and a shared commit­ment to constant feedback and constant course correction.</p>

  <p class="noindent3"><span class="smallcapb">Why seven? Why not six or eight or ten or fifteen? What is so sacred about seven?</span></p>

  <p class="noindent2">Nothing is sacred about seven, it just so happens that the three private victory habits (freedom to choose, choice, action) precede the three public victory habits (respect, understanding, creation) and then there is one to renew the rest and that equals seven.</p>

  <p>When asked this question, I’ve always said if there were some other desirable characteristic you would like make into a habit, you would simply put that under Habit 2 as one of the values you are trying to live by. In other words, if punctuality is a desir­able trait you want to make a habit, that would be one of the val­ues of Habit 2. So no matter what else you came up with you would put it under Habit 2, your value system. Habit one is the idea that you can have a value system, that you can choose your own value system. Habit 2 is what those choices or values are and Habit 3 is to live by them. So they are very basic, generic, and interconnected.</p>

  <p>It so happens that at the writing of this afterword for this new edition of the Seven Habits, I have just completed a new book entitled <span class="italic">The 8th Habit: From Effectiveness to Greatness.</span> To some, calling it the 8th Habit may appear to be a departure from my standard answer. But you see, as I say in the opening chapter of this new book, the world has profoundly changed since <span class="italic">The 7 Habits of Highly Effective People</span> was published in 1989. The chal­lenges and complexity we face in our personal lives and relation­ships, in our families, in our professional lives, and in our <a class="nodec1" id="pg328">organizations</a> are of a different order of magnitude. In fact, many mark 1989—the year we witnessed the fall of the Berlin Wall—as the beginning of the Information Age, the birth of a new reality, a sea change of incredible significance... truly a new era.</p>

  <p>Being <span class="italic">highly effective</span> as individuals and organizations is no longer optional in today’s world—it’s the price of entry to the playing field. But surviving, thriving, innovating, excelling and leading in this new reality will require us to build on and reach beyond effectiveness. The call and need of a new era is for <span class="italic">fulfillment.</span> It’s for <span class="italic">passionate optimization, for significant contribution</span> and <span class="italic">greatness.</span> These are on a different plane or <span class="italic">dimension.</span> They are different in kind—just as <span class="italic">significance</span> is different in <span class="italic">kind</span>, not in <span class="italic">degree</span>, from success. Tapping into the higher reaches of human genius and motivation—what we could call <span class="italic">voice</span>—requires a new mindset, a new skill-set, a new tool-set... a new habit.</p>

  <p>The 8th Habit, then, is not about adding one more habit to the 7th—one that somehow got forgotten. It’s about seeing and har­nessing the power of <span class="italic">a third dimension</span> to the 7 Habits that meets <span class="italic">the</span> central challenge of the new Knowledge Worker Age.</p>

  <p class="center3"><span><img alt="" src="../Images/image041.jpg"/></span></p>

  <p class="noindent3" id="pg329"><span class="smallcapb">How does notoriety affect you?</span></p>

  <p class="noindent2">It affects me in different ways. From an ego standpoint, it’s flat­tering. From a teaching standpoint it is humbling, but I must strongly acknowledge that I am not the author of any of these principles and deserve absolutely no recognition. I am not saying this because of a desire to be modest and humble. I am saying this because I believe it—that I, myself, believe it. I see myself like most of you—as a seeker of truth, of understanding. I am not a guru; I disdain being called a guru. I want no disciples. I am only trying to promote a discipleship toward principles that are already in people’s hearts, that people will live true to their con­science.</p>

  <p class="noindent3"><span class="smallcapb">If you had it to do over again, what is the one thing you would do differently as a businessperson?</span></p>

  <p class="noindent2">I would do more strategic, proactive recruiting and selecting. When you are buried by the urgent and have a thousand balls in the air, it is so easy to put people that appear to have solutions into key positions. The tendency is to not look deeply into their backgrounds and patterns, to do “due diligence,” nor is it to carefully develop the criteria that needs to be met in the particular roles or assignments. I am convinced that when recruiting and selecting is done strategically, that is, thinking long-term and proactively, not based upon the pressures of the moment, it pays enormous long-term dividends. Someone once said, “That which we desire most earnestly we believe most easily.” You really have to look deeply into both character and competence because even­tually, downstream, flaws in either area will manifest themselves in both areas. I am convinced that although training and devel­opment is important, recruiting and selection are much more important.</p>

  <p class="noindent3" id="pg330"><span class="smallcapb">If you had it to do over again, what is the one thing you would do differently as a parent?</span></p>

  <p class="noindent2">As a parent, I wish I had spent more time in carefully developing soft, informal win/win agreements with each of my children in the different phases of their lives. Because of business and travels I often indulged my children and went for lose/win too much instead of paying the price in relationship building sufficient to really develop thorough, sound win/win agreements more con­sistently.</p>

  <p class="noindent3"><span class="smallcapb">How is technology going to change business in the future?</span></p>

  <p class="noindent2">I believe in Stan Davis’s statement that “When the infrastructure changes, everything rumbles,” and I think the technical infrastruc­ture is central to everything. It will accelerate all good <span class="italic">and</span> bad trends. I’m also convinced that it is for these very reasons that the human element becomes even more important. High tech without high touch does not work, and, the more influential technology be­comes, the more important is the human factor which controls that technology becomes, particularly in developing a cultural commit­ment to the criteria in the use of that technology.</p>

  <p class="noindent3"><span class="smallcapb">Are you surprised or astounded at the universal popularity of the 7 Habits (with other countries/cultures/ages/gender)?</span></p>

  <p class="noindent2">Yes and no. Yes, in that I had no idea it would become a world­wide phenomenon and that a few of the words would become part of Americana. No, in the sense that the material had been tested for over twenty five years and I knew that it would work primarily because it is based upon principles I did not invent and therefore take no credit for.</p>

  <p class="noindent3" id="pg331"><span class="smallcapb">How would you begin to teach the 7 Habits to very young children?</span></p>

  <p class="noindent2">I think I would live by Albert Schweitzer’s three basic rules for raising children: First, example; second, example; third, example. But I wouldn’t go quite that far. I would say, first, example; sec­ond, build a caring and affirming relationship; and third, teach some of the simple ideas underlying the habits in the language of children—help them gain a basic understanding and vocabulary of the 7 Habits and show them how to process their own experi­ences through the principles; let them identify what particular principles and habits are being illustrated in their lives.</p>

  <p class="noindent3"><span class="smallcapb">My boss (spouse, child, friend, etc.) really needs the 7 Habits. How would you recommend I get them to read it?</span></p>

  <p class="noindent2">People don’t care how much you know until they know how much you care. Build a relationship of trust and openness based upon a character example of trustworthiness and then share how the 7 Habits have helped you. Simply let them see the 7 Habits in action through your life. Then, at the appropriate time, you might invite them to participate in a training program or share your book as a gift or teach some of the basic ideas when the occasion calls for it.</p>

  <p class="noindent3"><span class="smallcapb">What is your background and how did you come to write the 7 Habits?</span></p>

  <p class="noindent2">It was implicitly understood that I would follow in my father’s footsteps and go into the family business. However, I found that I enjoyed teaching and training leaders even more than business. I became deeply interested and involved in the human side of organizations when I was at Harvard Business School. Later I <a class="nodec1" id="pg332">taught</a> business subjects at Brigham Young University and did consulting, advising, and training on the side for several years. During that time, I became interested in creating integrated lead­ership and management development programs around a sequential and balanced set of principles. These eventually evolved into the 7 Habits and then while applying it to organiza­tions it evolved into the concept of principle-centered leadership. I decided to leave the university and go full-time into training executives from all different kinds of organizations. After a year of following a very carefully developed curriculum came the development of a business that has enabled us to take the mate­rial to people throughout the world.</p>

  <p class="noindent3"><span class="smallcapb">What is your response to the people who claim to have the true formula for success?</span></p>

  <p class="noindent2">I would say two things. First, if what they are saying is based on principles or natural laws, I want to learn from them and I com­mend them. Second, I would say we are probably using different words to describe the same basic principles or natural laws.</p>

  <p class="noindent3"><span class="smallcapb">Are you really bald or do you shave your head for efficiency’s sake?</span></p>

  <p class="noindent2">Hey, listen, while you’re busy blow-drying your hair, I’m out serving the customers. In fact, the first time I heard the expression, “Bald is beautiful,” I kicked the slats out of my crib!</p>
