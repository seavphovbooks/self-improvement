<body class="nohyph">
  <h3 class="chaph" id="appa"><span class="italic">APPENDIX A</span></h3>

  <h3 class="chaph sigilNotInTOC" id="pg333">POSSIBLE PERCEPTIONS FLOWING<br/>
  out of VARIOUS CENTERS</h3>

  <div class="line4">
    <p class="smallcapc" id="pg334"><b><br/></b></p>
  </div>

  <div>
    <p>If your center is: <span class="bold">Spouse</span></p>

    <p><span class="bold"><small>These are alternative ways you may tend to perceive other areas of your life:</small></span></p>

    <p><span class="bold">Spouse</span></p>

    <ul class="nomargin">
      <li>The main source of need satisfaction</li>
    </ul>

    <p><span class="bold">Family</span></p>

    <ul class="nomargin">
      <li>Good in its place</li>

      <li>Less important</li>

      <li>A common project</li>
    </ul>

    <p><span class="bold">Money</span></p>

    <ul class="nomargin">
      <li>Necessary to properly take care of spouse</li>
    </ul>

    <p><span class="bold">Work</span></p>

    <ul class="nomargin">
      <li>Necessary to earn money to care for spouse</li>
    </ul>

    <p><span class="bold">Possessions</span></p>

    <ul class="nomargin">
      <li>Means to bless, impress, or manipulate</li>
    </ul>

    <p><span class="bold">Pleasure</span></p>

    <ul class="nomargin">
      <li>Mutual, unifying activity or unimportant</li>
    </ul>

    <p><span class="bold">A Friend or Friends</span></p>

    <ul class="nomargin">
      <li>Spouse is best or only friend</li>

      <li>Only friends are “our” friends</li>
    </ul>

    <p><span class="bold">Enemy or Enemies</span></p>

    <ul class="nomargin">
      <li>Spouse is my defender, or common enemy provides source of marriage definition</li>
    </ul>

    <p><span class="bold">Church</span></p>

    <ul class="nomargin">
      <li>Activity to enjoy together</li>

      <li>Subordinate to relationship</li>
    </ul>

    <p><span class="bold">Self</span></p>

    <ul class="nomargin">
      <li>Self-worth is spouse based</li>

      <li>Highly vulnerable to spouse attitudes and behaviors</li>
    </ul>

    <p><span class="bold">Principles</span></p>

    <ul class="nomargin">
      <li>Ideas which create and maintain relationship with spouse</li>
    </ul>
  </div>

  <div>
    <hr class="lineb"/>

    <p>If your center is: <span class="bold">Family</span></p>

    <p><span class="bold"><small>These are alternative ways you may tend to perceive other areas of your life:</small></span></p>

    <p><span class="bold">Spouse</span></p>

    <ul class="nomargin">
      <li>Part of the family</li>
    </ul>

    <p><span class="bold">Family</span></p>

    <ul class="nomargin">
      <li>The highest priority</li>
    </ul>

    <p><span class="bold">Money</span></p>

    <ul class="nomargin">
      <li>Family economic support</li>
    </ul>

    <p><span class="bold">Work</span></p>

    <ul class="nomargin">
      <li>A means to an end</li>
    </ul>

    <p><span class="bold">Possessions</span></p>

    <ul class="nomargin">
      <li>Family comfort and opportunities</li>
    </ul>

    <p><span class="bold">Pleasure</span></p>

    <ul class="nomargin">
      <li>Family activities or relatively unimportant</li>
    </ul>

    <p><span class="bold">A Friend or Friends</span></p>

    <ul class="nomargin">
      <li>Friends of the family, or competition</li>

      <li>Threat to strong family life</li>
    </ul>
  </div>

  <p><span class="bold">Enemy or Enemies</span></p>

  <ul class="nomargin">
    <li>Defined by family</li>

    <li>Source of family strength and unity</li>

    <li>Possible threat to family strength</li>
  </ul>

  <p><span class="bold">Church</span></p>

  <ul class="nomargin">
    <li>Source of help</li>
  </ul>

  <p><span class="bold">Self</span></p>

  <ul class="nomargin">
    <li>Vital part of but subordinate to family</li>
  </ul>

  <p><span class="bold">Principles</span></p>

  <ul class="nomargin">
    <li>Rules which keep family unified and strong</li>

    <li>Subordinate to family</li>
  </ul>

  <div>
    <hr class="lineb"/>

    <p>If your center is: <span class="bold">Money</span></p>

    <p><span class="bold"><small>These are alternative ways you may tend to perceive other areas of your life:</small></span></p>

    <p><span class="bold">Spouse</span></p>

    <ul class="nomargin">
      <li>Asset or liability in acquiring money</li>
    </ul>

    <p><span class="bold">Family</span></p>

    <ul class="nomargin">
      <li>Economic drain</li>
    </ul>

    <p><span class="bold">Money</span></p>

    <ul class="nomargin">
      <li>Source of security and fulfillment</li>
    </ul>

    <p><span class="bold">Work</span></p>

    <ul class="nomargin">
      <li>Necessary to the acquisition of money</li>
    </ul>

    <p><span class="bold">Possessions</span></p>

    <ul class="nomargin">
      <li>Evidence of economic success</li>
    </ul>

    <p><span class="bold">Pleasure</span></p>

    <ul class="nomargin">
      <li>Economic drain or evidence of economic stress</li>
    </ul>

    <p><span class="bold">A Friend or Friends</span></p>

    <ul class="nomargin">
      <li>Chosen because of economic status or influence</li>
    </ul>

    <p><span class="bold">Enemy or Enemies</span></p>

    <ul class="nomargin">
      <li>Economic competitors</li>

      <li>Threat to economic security</li>
    </ul>

    <p><span class="bold">Church</span></p>

    <ul class="nomargin">
      <li>Tax write-off</li>

      <li>Hand in your pocket</li>
    </ul>

    <p><span class="bold">Self</span></p>

    <ul class="nomargin">
      <li>Self-worth is determined by net worth</li>
    </ul>

    <p><span class="bold">Principles</span></p>

    <ul class="nomargin">
      <li>Ways that work in making and managing money</li>
    </ul>
  </div>

  <div>
    <hr class="lineb"/>

    <p>If your center is: <span class="bold">Work</span></p>

    <p><span class="bold"><small>These are alternative ways you may tend to perceive other areas of your life:</small></span></p>

    <p><span class="bold">Spouse</span></p>

    <ul class="nomargin">
      <li>Help or hindrance in work</li>
    </ul>

    <p><span class="bold">Family</span></p>

    <ul class="nomargin">
      <li>Help or interruption to work</li>

      <li>People to instruct in work ethic</li>
    </ul>

    <p><span class="bold">Money</span></p>

    <ul class="nomargin">
      <li>Of secondary importance</li>

      <li>Evidence of hard work</li>
    </ul>

    <p><span class="bold">Work</span></p>

    <ul class="nomargin">
      <li>Main source of fulfillment and satisfaction</li>

      <li>Highest ethic</li>
    </ul>

    <p><span class="bold">Possessions</span></p>

    <ul class="nomargin">
      <li>Tools to increase work effectiveness</li>

      <li>Fruits, badge of work</li>
    </ul>

    <p><span class="bold">Pleasure</span></p>

    <ul class="nomargin">
      <li>Waste of time</li>

      <li>Interferes with work</li>
    </ul>

    <p><span class="bold">A Friend or Friends</span></p>

    <ul class="nomargin">
      <li>Developed from work setting or shared interest</li>

      <li>Basically unnecessary</li>
    </ul>

    <p><span class="bold">Enemy or Enemies</span></p>

    <ul class="nomargin">
      <li>Obstacles to work productivity</li>
    </ul>

    <p><span class="bold">Church</span></p>

    <ul class="nomargin">
      <li>Important to corporate image</li>

      <li>Imposition on your time</li>

      <li>Opportunity to network</li>
    </ul>

    <p><span class="bold">Self</span></p>

    <ul class="nomargin">
      <li>Defined by job role</li>
    </ul>

    <p><span class="bold">Principles</span></p>

    <ul class="nomargin">
      <li>Ideas that make you successful in your work</li>

      <li>Need to adapt to work conditions</li>
    </ul>
  </div>

  <div>
    <hr class="lineb"/>

    <p>If your center is: <span class="bold">Possessions</span></p>

    <p><span class="bold"><small>These are alternative ways you may tend to perceive other areas of your life:</small></span></p>

    <p><span class="bold">Spouse</span></p>

    <ul class="nomargin">
      <li>Main possession</li>

      <li>Assistant in acquiring possessions</li>
    </ul>

    <p><span class="bold">Family</span></p>

    <ul class="nomargin">
      <li>Possession to use, exploit, dominate, smother, control</li>

      <li>Showcase</li>
    </ul>

    <p><span class="bold">Money</span></p>

    <ul class="nomargin">
      <li>Key to increasing possessions</li>

      <li>Another possession to control</li>
    </ul>

    <p><span class="bold">Work</span></p>

    <ul class="nomargin">
      <li>Opportunity to possess status, authority, recognition</li>
    </ul>

    <p><span class="bold">Possessions</span></p>

    <ul class="nomargin">
      <li>Status symbols</li>
    </ul>

    <p><span class="bold">Pleasure</span></p>

    <ul class="nomargin">
      <li>Buying, shopping, joining clubs</li>
    </ul>

    <p><span class="bold">A Friend or Friends</span></p>

    <ul class="nomargin">
      <li>Personal objects</li>

      <li>Usable</li>
    </ul>

    <p><span class="bold">Enemy or Enemies</span></p>

    <ul class="nomargin">
      <li>Takers, thieves</li>

      <li>Others with more possessions or recognition</li>
    </ul>

    <p><span class="bold">Church</span></p>

    <ul class="nomargin">
      <li>“My” church, a status symbol</li>

      <li>Source of unfair criticism or good things in life</li>
    </ul>

    <p><span class="bold">Self</span></p>

    <ul class="nomargin">
      <li>Defined by the things I own</li>

      <li>Defined by social status, recognition</li>
    </ul>

    <p><span class="bold">Principles</span></p>

    <ul class="nomargin">
      <li>Concepts which enable you to acquire and enhance possessions</li>
    </ul>
  </div>

  <div>
    <hr class="lineb"/>

    <p>If your center is: <span class="bold">Pleasure</span></p>

    <p><span class="bold"><small>These are alternative ways you may tend to perceive other areas of your life:</small></span></p>

    <p><span class="bold">Spouse</span></p>

    <ul class="nomargin">
      <li>Companion in fun and pleasure or obstacle to it</li>
    </ul>

    <p><span class="bold">Family</span></p>

    <ul class="nomargin">
      <li>Vehicle or interference</li>
    </ul>

    <p><span class="bold">Money</span></p>

    <ul class="nomargin">
      <li>Means to increase opportunities for pleasure</li>
    </ul>

    <p><span class="bold">Work</span></p>

    <ul class="nomargin">
      <li>Means to an end</li>

      <li>“Fun” work OK</li>
    </ul>

    <p><span class="bold">Possessions</span></p>

    <ul class="nomargin">
      <li>Objects of fun</li>

      <li>Means to more fun</li>
    </ul>

    <p><span class="bold">Pleasure</span></p>

    <ul class="nomargin">
      <li>Supreme end in life</li>

      <li>Main source of satisfaction</li>
    </ul>

    <p><span class="bold">A Friend or Friends</span></p>

    <ul class="nomargin">
      <li>Companions in fun</li>
    </ul>

    <p><span class="bold">Enemy or Enemies</span></p>

    <ul class="nomargin">
      <li>Take life too seriously</li>

      <li>Guilt trippers, destroyers</li>
    </ul>

    <p><span class="bold">Church</span></p>

    <ul class="nomargin">
      <li>Inconvenient, obstacle to recreation</li>

      <li>Guilt trip</li>
    </ul>

    <p><span class="bold">Self</span></p>

    <ul class="nomargin">
      <li>Instrument for pleasure</li>
    </ul>

    <p><span class="bold">Principles</span></p>

    <ul class="nomargin">
      <li>Natural drives and instincts which need to be satisfied</li>
    </ul>
  </div>

  <div>
    <hr class="lineb"/>

    <p>If your center is: <span class="bold">A Friend or Friends</span></p>

    <p><span class="bold"><small>These are alternative ways you may tend to perceive other areas of your life:</small></span></p>

    <p><span class="bold">Spouse</span></p>

    <ul class="nomargin">
      <li>Possible friend or possible competitor</li>

      <li>Social status symbol</li>
    </ul>

    <p><span class="bold">Family</span></p>

    <ul class="nomargin">
      <li>Friends or obstacle to developing friendships</li>

      <li>Social status symbol</li>
    </ul>

    <p><span class="bold">Money</span></p>

    <ul class="nomargin">
      <li>Source of economic and social good</li>
    </ul>

    <p><span class="bold">Work</span></p>

    <ul class="nomargin">
      <li>Social opportunity</li>
    </ul>

    <p><span class="bold">Possessions</span></p>

    <ul class="nomargin">
      <li>Means of buying friendship</li>

      <li>Means of entertaining or providing social pleasure</li>
    </ul>

    <p><span class="bold">Pleasure</span></p>

    <ul class="nomargin">
      <li>Enjoyed always with friends</li>

      <li>Primarily social events</li>
    </ul>

    <p><span class="bold">A Friend or Friends</span></p>

    <ul class="nomargin">
      <li>Critical to personal happiness</li>

      <li>Belonging, acceptance, popularity is crucial</li>
    </ul>

    <p><span class="bold">Enemy or Enemies</span></p>

    <ul class="nomargin">
      <li>Outside the social circle</li>

      <li>Common enemies provide unity or definition for friendship</li>
    </ul>

    <p><span class="bold">Church</span></p>

    <ul class="nomargin">
      <li>Place for social gathering</li>
    </ul>

    <p><span class="bold">Self</span></p>

    <ul class="nomargin">
      <li>Socially defined</li>

      <li>Afraid of embarrassment or rejection</li>
    </ul>

    <p><span class="bold">Principles</span></p>

    <ul class="nomargin">
      <li id="pg335">Basic laws which enable you to get along with others</li>
    </ul>
  </div>

  <div>
    <hr class="lineb"/>

    <p>If your center is: <span class="bold">An Enemy or Enemies</span></p>

    <p><span class="bold"><small>These are alternative ways you may tend to perceive other areas of your life:</small></span></p>

    <p><span class="bold">Spouse</span></p>

    <ul class="nomargin">
      <li>Sympathizer or scapegoat</li>
    </ul>

    <p><span class="bold">Family</span></p>

    <ul class="nomargin">
      <li>Refuge (emotional support) or scapegoat</li>
    </ul>

    <p><span class="bold">Money</span></p>

    <ul class="nomargin">
      <li>Means to fight with or prove superiority</li>
    </ul>

    <p><span class="bold">Work</span></p>

    <ul class="nomargin">
      <li>Escape or opportunity to vent feelings</li>
    </ul>

    <p><span class="bold">Possessions</span></p>

    <ul class="nomargin">
      <li>Fighting tools</li>

      <li>Means to secure allies</li>

      <li>Escape, refuge</li>
    </ul>

    <p><span class="bold">Pleasure</span></p>

    <ul class="nomargin">
      <li>Rest and relaxation time before the next battle</li>
    </ul>

    <p><span class="bold">A Friend or Friends</span></p>

    <ul class="nomargin">
      <li>Emotional supporters and sympathizers</li>

      <li>Possibly defined by common enemy</li>
    </ul>

    <p><span class="bold">Enemy or Enemies</span></p>

    <ul class="nomargin">
      <li>Objects of hate</li>

      <li>Source of personal problems</li>

      <li>Stimuli to self-protection and self-justification</li>
    </ul>

    <p><span class="bold">Church</span></p>

    <ul class="nomargin">
      <li>Source of self-justification</li>
    </ul>

    <p><span class="bold">Self</span></p>

    <ul class="nomargin">
      <li>Victimized</li>

      <li>Immobilized by enemy</li>
    </ul>

    <p><span class="bold">Principles</span></p>

    <ul class="nomargin">
      <li>Justification for labeling enemies</li>

      <li>Source of your enemy’s wrongness</li>
    </ul>
  </div>

  <div>
    <hr class="lineb"/>

    <p>If your center is: <span class="bold">Church</span></p>

    <p><span class="bold"><small>These are alternative ways you may tend to perceive other areas of your life:</small></span></p>

    <p><span class="bold">Spouse</span></p>

    <ul class="nomargin">
      <li>A companion in or facilitator for church service, or a trial of faith</li>
    </ul>

    <p><span class="bold">Family</span></p>

    <ul class="nomargin">
      <li>Models to exemplify adherence to church teachings, or trials of faith</li>
    </ul>

    <p><span class="bold">Money</span></p>

    <ul class="nomargin">
      <li>Means to support church and family</li>

      <li>Evil, if greater in priority than church service or teachings</li>
    </ul>

    <p><span class="bold">Work</span></p>

    <ul class="nomargin">
      <li>Necessary for temporal support</li>
    </ul>

    <p><span class="bold">Possessions</span></p>

    <ul class="nomargin">
      <li>Temporal possessions of minimal importance</li>

      <li>Reputation and image of great worth</li>
    </ul>

    <p><span class="bold">Pleasure</span></p>

    <ul class="nomargin">
      <li>“Innocent” pleasures as an opportunity to gather with other church members</li>

      <li>Others as sinful or time wasters, to be self-righteously denied</li>
    </ul>

    <p><span class="bold">A Friend or Friends</span></p>

    <ul class="nomargin">
      <li>Other members of the church</li>
    </ul>

    <p><span class="bold">Enemy or Enemies</span></p>

    <ul class="nomargin">
      <li>Nonbelievers; those who disagree with church teachings or whose lives are in blatant opposition to them</li>
    </ul>

    <p><span class="bold">Church</span></p>

    <ul class="nomargin">
      <li>Highest priority source of guidance</li>
    </ul>

    <p><span class="bold">Self</span></p>

    <ul class="nomargin">
      <li>Self-worth is determined by activity in the church, contributions to the church, or performance of deeds that reflect the church ethic</li>
    </ul>

    <p><span class="bold">Principles</span></p>

    <ul class="nomargin">
      <li>Doctrines taught by the church</li>

      <li>Subordinate to the church</li>
    </ul>
  </div>

  <div>
    <hr class="lineb"/>

    <p>If your center is: <span class="bold">Self</span></p>

    <p><span class="bold"><small>These are alternative ways you may tend to perceive other areas of your life:</small></span></p>

    <p><span class="bold">Spouse</span></p>

    <ul class="nomargin">
      <li>Satisfier and pleaser</li>
    </ul>

    <p><span class="bold">Family</span></p>

    <ul class="nomargin">
      <li>Possession</li>

      <li>Need satisfier</li>
    </ul>

    <p><span class="bold">Money</span></p>

    <ul class="nomargin">
      <li>Source of needs satisfaction</li>
    </ul>

    <p><span class="bold">Work</span></p>

    <ul class="nomargin">
      <li>Opportunity to “do my own thing”</li>
    </ul>

    <p><span class="bold">Possessions</span></p>

    <ul class="nomargin">
      <li>Source of self-definition, protection, enhancement</li>
    </ul>

    <p><span class="bold">Pleasure</span></p>

    <ul class="nomargin">
      <li>Deserved sensate satisfactions</li>

      <li>“My rights”</li>

      <li>“My needs”</li>
    </ul>

    <p><span class="bold">A Friend or Friends</span></p>

    <ul class="nomargin">
      <li>Supporter, provider for “me”</li>
    </ul>

    <p><span class="bold">Enemy or Enemies</span></p>

    <ul class="nomargin">
      <li>Source of self-definition, self-justification</li>
    </ul>

    <p><span class="bold">Church</span></p>

    <ul class="nomargin">
      <li>Vehicle to serve self-interests</li>
    </ul>

    <p><span class="bold">Self</span></p>

    <ul class="nomargin">
      <li>Better, smarter, more right</li>

      <li>Justified in focusing all resources on personal gratification</li>
    </ul>

    <p><span class="bold">Principles</span></p>

    <ul class="nomargin">
      <li>Source of justification</li>

      <li>Those ideas that serve my best interests; can be adapted to need</li>
    </ul>
  </div>

  <div id="pg336">
    <hr class="lineb"/>

    <p>If your center is: <span class="bold">Principles</span></p>

    <p><span class="bold"><small>These are alternative ways you may tend to perceive other areas of your life:</small></span></p>

    <p><span class="bold">Spouse</span></p>

    <ul class="nomargin">
      <li>Equal partner in a mutually beneficial interdependent relationship</li>
    </ul>

    <p><span class="bold">Family</span></p>

    <ul class="nomargin">
      <li>Friends</li>

      <li>Opportunity for service, contribution, and fulfillment</li>

      <li>Opportunity for intergenerational rescripting and change</li>
    </ul>

    <p><span class="bold">Money</span></p>

    <ul class="nomargin">
      <li>Enabling resource in the accomplishment of important priorities and goals</li>
    </ul>

    <p><span class="bold">Work</span></p>

    <ul class="nomargin">
      <li>Opportunity to use talents and abilities in a meaningful way</li>

      <li>Means to provide economic resource</li>

      <li>Time investment to be kept in balance with other time investments and in harmony with priorities and values in life</li>
    </ul>

    <p><span class="bold">Possessions</span></p>

    <ul class="nomargin">
      <li>Enabling resources</li>

      <li>Responsibilities to be properly cared for</li>

      <li>Secondary to people in importance</li>
    </ul>

    <p><span class="bold">Pleasure</span></p>

    <ul class="nomargin">
      <li>Joy that comes from almost any activity in a focused life</li>

      <li>True re-creation as an important part of a balanced, integrated life-style</li>
    </ul>

    <p><span class="bold">A Friend or Friends</span></p>

    <ul class="nomargin">
      <li>Companions in interdependent livings</li>

      <li>Confidants—those to share with, serve, and support</li>
    </ul>

    <p><span class="bold">Enemy or Enemies</span></p>

    <ul class="nomargin">
      <li>No real perceived “enemies"; just people with different paradigms and agendas to be understood and cared about</li>
    </ul>

    <p><span class="bold">Church</span></p>

    <ul class="nomargin">
      <li>Vehicle for true principles</li>

      <li>Opportunity for service and contribution</li>
    </ul>

    <p><span class="bold">Self</span></p>

    <ul class="nomargin">
      <li>One unique, talented, creative individual in the midst of many unique, talented, creative individuals who, working independently and interdependently, can accomplish great things</li>
    </ul>

    <p><span class="bold">Principles</span></p>

    <ul class="nomargin">
