  <h3 class="chaph" id="forwd">Foreword</h3>

  <p class="noindent4" id="pg7">When I wrote this book in 1989, I had no idea how the world would change and that people would be able to read The 7 Habits of Highly Effective People in this amazing way on these amazing devices.</p>

  <p>Since then, this book has been called “the most influential business book of the century” (by The Wall Street Journal). It stayed on The New York Times best-seller list for five years. A “must-read” translated into 38 languages, with 20 million copies in print (and is arguably the most pirated business book in the world). Google 7 Habits and you’ll get more than 12 million hits.</p>

  <p>I’ve been humbled and gratified by the worldwide audience this book has reached. Presidents, prime ministers, and kings read the book, but so do college students, construction workers, and kitchen help. I’ve heard from literally thousands of people who say things like this:</p>

  <ul style="margin-top: 10px;">
    <li>“I learned to focus on truly important things, not just urgent things.”</li>

    <li>I listen—really listen—to other people for the first time.”</li>

    <li>“Since I started thinking win-win in a job that was killing me, I’ve found a new mission and purpose in my professional life.”</li>
  </ul>

  <p class="indent2">How will The 7 Habits impact you? My hope is that you will find new hope, a greater sense of purpose, more peace of mind, and far more rewarding relationships in both your personal and professional life.</p>

  <p class="noindent2">Stephen R. Covey</p>

  <p class="noindent">December 2009</p>

  <p class="noindent2">FranklinCovey Co.</p>
