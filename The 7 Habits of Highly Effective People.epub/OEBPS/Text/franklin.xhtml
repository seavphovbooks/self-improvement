  <h3 class="chaph" id="aboutf">About FranklinCovey</h3>

  <p class="center6"><span class="bold">MISSION STATEMENT</span></p>

  <p class="center3">We enable greatness in people and organizations everywhere.</p>

  <h3 class="chaph sigilNotInTOC">FOUNDATIONAL BELIEFS</h3>

  <p class="noindent3">We believe:</p>

  <ol>
    <li><span class="bold">People</span> are inherently capable, aspire to greatness and have the power to choose.</li>

    <li><span class="bold">Principles</span> are timeless and universal, and are the foundation for lasting effectiveness.</li>

    <li><span class="bold">Leadership</span> is a choice, built inside out on a foundation of char­acter. Great leaders unleash the collective talent and passion of people toward the right goal.</li>

    <li><span class="bold">Habits of effectiveness</span> come only from the committed use of integrated processes and tools.</li>

    <li><span class="bold">Sustained superior performance</span> requires P/PC Balance®—a focus on achieving results and on building capability.</li>
  </ol>

  <p class="center4"><span class="bold">VALUES</span></p>

  <ol>
    <li><span class="bold">Commitment to Principles.</span> We are passionate about our con­tent, and strive to be models of the principles and practices we teach.</li>

    <li><span class="bold">Lasting Customer Impact.</span> We are relentless about delivering on our promises to our customers. Our success comes only with their success.</li>

    <li><span class="bold">Respect for the Whole Person.</span> We value each other and treat each person with whom we work as true partners.</li>

    <li><span class="bold">Profitable Growth.</span> We embrace profitability and growth as the lifeblood of our organization; they give us the freedom to fulfill our mission and vision.</li>
  </ol>

  <p class="noindent3">FranklinCovey (NYSE:FC) is the global leader in effectiveness train­ing, productivity tools and assessment services for organizations, teams and individuals. Clients include 90 percent of the Fortune 100, more than 75 percent of the Fortune 500, thousands of small and midsized busi­nesses, as well as numerous government entities and educational institu­tions. Organizations and individuals access FranklinCovey products and services through corporate training, licensed client facilitators, one-on-one coaching, public workshops, catalogs, more than 140 retail stores and <span class="bold">www.franklincovey.com</span>.</p>

  <p>FranklinCovey has 2,000 associates providing professional services, products and materials in twenty-eight languages, in thirty-nine offices and in ninety-five countries worldwide.</p>

  <p class="center3"><span class="bold">Programs and Services</span></p>

  <ul>
    <li>xQ Survey and Debrief (<span class="italic">to help leaders assess their organization’s “Ex­ecution Quotient”</span>)</li>

    <li>The 7 Habits of Highly Effective People workshop</li>

    <li>The 4 Disciplines of Execution worksession</li>

    <li>FOCUS: Achieving Your Highest Priorities workshop</li>

    <li>The 4 Roles of Leadership workshop</li>

    <li>The FranklinCovey Planning System</li>
