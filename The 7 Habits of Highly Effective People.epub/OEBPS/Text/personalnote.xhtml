  <h3 class="chaph" id="personal"><span class="bold">A Personal Note</span></h3>

  <p class="noindent3" id="pg319">As I conclude this book, I would like to share my own personal conviction concerning what I believe to be the source of correct principles. I believe that correct principles are natural laws, and that God, the Creator and Father of us all, is the source of them, and also the source of our conscience. I believe that to the degree people live by this inspired conscience, they will grow to fulfill their natures; to the degree that they do not, they will not rise above the animal plane.</p>

  <p>I believe that there are parts to human nature that cannot be reached by either legislation or education, but require the power of God to deal with. I believe that as human beings, we cannot perfect ourselves. To the degree to which we align ourselves with correct principles, divine endowments will be released within our nature in enabling us to fulfill the measure of our creation. In the words of Teilhard de Chardin, “We are not human beings having a spiritual experience. We are spiritual beings having a human experience.”</p>

  <p>I personally struggle with much of what I have shared in this book. But the struggle is worthwhile and fulfilling. It gives meaning to my life and enables me to love, to serve, and to try again.</p>

  <p>Again, T. S. Eliot expresses so beautifully my own personal discovery and conviction: “We must not cease from exploration. And the end of all our exploring will be to arrive where we began and to know the place for the first time.”</p>
